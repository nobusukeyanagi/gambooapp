<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <title>Gamboo App - Page List</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #f5f5f3;
      color: #1a1a1a;
    }
    main {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 72px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.35;
    }
    .sub {
      margin: 8px 0 28px;
      color: #777;
      font-size: 14px;
    }
    .list {
      display: grid;
      gap: 12px;
    }
    a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 64px;
      padding: 16px 18px;
      border: 1px solid #ddd9d2;
      border-radius: 12px;
      background: #fff;
      color: #1a1a1a;
      text-decoration: none;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    a:hover {
      transform: translateY(-1px);
      border-color: #f5a623;
      box-shadow: 0 6px 18px rgba(0,0,0,.07);
    }
    .code {
      flex: 0 0 auto;
      min-width: 108px;
      font-weight: 800;
      color: #d4891a;
      font-size: 13px;
    }
    .name {
      flex: 1;
      font-weight: 700;
      font-size: 16px;
    }
    .arrow {
      color: #aaa;
      font-size: 20px;
    }
    .note {
      margin-top: 28px;
      padding: 14px 16px;
      border-radius: 10px;
      background: #ecebe7;
      color: #666;
      font-size: 12px;
      line-height: 1.7;
    }
    @media (max-width: 560px) {
      main { padding-top: 32px; }
      h1 { font-size: 24px; }
      a { align-items: flex-start; }
      .code { min-width: 92px; }
      .name { font-size: 15px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Gamboo App ページ一覧</h1>
    <p class="sub">確認したい画面を選択してください。</p>

    <div class="list">
      <a href="scr-01-home.html"><span class="code">SCR-01</span><span class="name">ホーム</span><span class="arrow">›</span></a>
      <a href="scr-02-race-card-venue-list.html"><span class="code">SCR-02</span><span class="name">出走表 場一覧</span><span class="arrow">›</span></a>
      <a href="scr-02-auto-race-venue-list.html"><span class="code">SCR-02-AUTO</span><span class="name">出走表 オート場一覧</span><span class="arrow">›</span></a>
      <a href="scr-03-race-card-details.html"><span class="code">SCR-03</span><span class="name">出走表詳細</span><span class="arrow">›</span></a>
      <a href="scr-03-advanced-analysis.html"><span class="code">SCR-03</span><span class="name">マニア分析タブ</span><span class="arrow">›</span></a>
      <a href="scr-04-auto-race-card-details.html"><span class="code">SCR-04</span><span class="name">オート出走表詳細</span><span class="arrow">›</span></a>
      <a href="scr-04-data-analysis-lab.html"><span class="code">SCR-04</span><span class="name">データ解析ラボ</span><span class="arrow">›</span></a>
      <a href="scr-07-my-page.html"><span class="code">SCR-07</span><span class="name">マイページ</span><span class="arrow">›</span></a>
      <a href="scr-11-campaign.html"><span class="code">SCR-11</span><span class="name">キャンペーン</span><span class="arrow">›</span></a>
    </div>

    <div class="note">このサイトは検索エンジンへの登録を避けるため、全ページに noindex を設定しています。</div>
  </main>
</body>
</html>
