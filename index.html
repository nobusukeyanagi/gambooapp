<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>画面QRコード一覧 | Gambooアプリ</title>
  <link rel="stylesheet" href="./assets/design-tokens.css?v=46" />
  <style>
    :root{ color-scheme:light; font-family:var(--ff-ui); font-synthesis:none; }
    *{ box-sizing:border-box; }
    html,body{min-height:100%; margin:0;}
    body{background:var(--c-bg);color:var(--c-text);font-size:var(--fs-16);line-height:1.65;}
    button,input{font:inherit;}
    button{cursor:pointer;}
    .hidden{display:none!important;}
    .login-view{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:linear-gradient(160deg,var(--c-bg),var(--c-bg));}
    .login-panel{width:min(100%,420px);padding:40px 36px 36px;background:var(--c-surface);border: var(--line-normal);border-radius:16px;box-shadow:0 16px 52px color-mix(in srgb, var(--c-text) 8%, transparent);}
    .login-panel .password-heading{display:block;margin:0 0 26px;font-size:var(--fs-24);line-height:1.4;letter-spacing:normal;font-weight:700;text-align:center;color:var(--c-text);}
    .login-panel input{height:48px;padding:0 14px;width:100%;border: var(--line-thin) solid var(--c-sub);border-radius:8px;background:var(--c-surface);color:var(--c-text);}
    .login-panel input:focus{outline: var(--line-focus);border-color:var(--c-keirin);}
    .login-panel button{margin-top:18px;width:100%;padding:12px 20px;border:0;border-radius:8px;background:var(--c-keirin);color:var(--c-surface);font-weight:700;}
    .login-panel button:hover,.btn-primary:hover{background:var(--c-keirin);}
    .error{min-height:1.6em;margin:9px 0 -7px;color:var(--c-error);font-size:var(--fs-14);}
    .page-wrap{width:min(1170px,calc(100% - 48px));margin:0 auto;}
    main{padding:24px 0 52px;}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;}
    .card{background:var(--c-surface);border: var(--line-normal);border-radius:12px;padding:24px 20px 19px;display:flex;flex-direction:column;align-items:center;min-width:0;box-shadow:0 2px 7px color-mix(in srgb, var(--c-text) 2.8000000000000003%, transparent);break-inside:avoid;}
    .qr-link{display:flex;align-items:center;justify-content:center;width:196px;height:196px;max-width:100%;border-radius:5px;text-decoration:none;}
    .qr-link:focus-visible{outline: var(--line-focus);outline-offset:4px;}
    .qr-link svg{width:100%;height:100%;display:block;image-rendering:pixelated;}
    .code{font-size:var(--fs-12);line-height:1.5;font-weight:800;color:var(--c-sub);letter-spacing:.04em;margin-top:15px;}
    .screen-name{margin:4px 0 0;font-weight:800;color:var(--c-text);text-align:center;line-height:1.5;font-size:var(--fs-16);overflow-wrap:anywhere;}
    @media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
    @media(max-width:550px){.page-wrap{width:calc(100% - 28px)}.grid{grid-template-columns:1fr;gap:12px}.card{padding:24px 12px}.login-panel{padding:32px 24px;}}
    @page{size:A4 portrait;margin:10mm;}
    @media print{
      body{background:var(--c-surface)!important;color:var(--c-text);print-color-adjust:exact;-webkit-print-color-adjust:exact;}
      .page-wrap{width:100%;max-width:none;}
      main{padding:6px 0;}
      .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;}
      .card{border: var(--line-normal);border-radius:5px;padding:10px 5px 11px;box-shadow:none;}
      .qr-link{width:135px;height:135px;}.code{font-size:var(--fs-12);margin-top:5px;}.screen-name{font-size:var(--fs-12);}
    }
  </style>
  <link rel="stylesheet" href="./assets/tap-feedback.css?v=3" />
    <link rel="stylesheet" href="./assets/ui-consistency.css?v=9" />
  </head>
<body>
  <section id="login-view" class="login-view" aria-label="パスワード認証">
    <div class="login-panel">
      <form id="login-form" novalidate>
        <label for="password" class="password-heading">パスワード</label>
        <input id="password" type="password" autocomplete="current-password" spellcheck="false" required autofocus>
        <div id="login-error" class="error" role="alert" aria-live="polite"></div>
        <button type="submit">認証して開く</button>
      </form>
    </div>
  </section>
  <div id="gallery-view" class="hidden">
    <main class="page-wrap">
      <div class="grid" id="qr-grid"></div>
    </main>
  </div>
  <script src="./assets/qrcode-generator.js"></script>
  <script>
    'use strict';
    const PAGES = [
    {
        "file": "SCR-01_home.html",
        "code": "SCR-01",
        "title": "ホーム"
    },
    {
        "file": "SCR-02_出走表_場一覧.html",
        "code": "SCR-02",
        "title": "出走表（場一覧）"
    },
    {
        "file": "SCR-02-AUTO_出走表_オート場一覧.html",
        "code": "SCR-02-AUTO",
        "title": "出走表（オートレース・場一覧）"
    },
    {
        "file": "SCR-03_出走表詳細.html",
        "code": "SCR-03",
        "title": "出走表詳細"
    },
    {
        "file": "SCR-03_出走表詳細_9車立て.html",
        "code": "SCR-03",
        "title": "出走表詳細（9車立て）"
    },
    {
        "file": "SCR-03_マニア分析タブ.html",
        "code": "SCR-03",
        "title": "マニア分析タブ"
    },
    {
        "file": "SCR-04_オート出走表詳細.html",
        "code": "SCR-04",
        "title": "オート出走表詳細"
    },
    {
        "file": "SCR-04_データ解析ラボ.html",
        "code": "SCR-04",
        "title": "データ解析ラボ"
    },
    {
        "file": "SCR-07_マイページ.html",
        "code": "SCR-07",
        "title": "マイページ"
    },
    {
        "file": "SCR-08_マイページ_お気に入り.html",
        "code": "SCR-08",
        "title": "マイページ（お気に入り）"
    },
    {
        "file": "SCR-09_マイページ_設定.html",
        "code": "SCR-09",
        "title": "マイページ（設定）"
    },
    {
        "file": "SCR-11_キャンペーン.html",
        "code": "SCR-11",
        "title": "キャンペーン"
    }

];
    // This is a client-side display gate only, not HTTP Basic authentication.
    // GitHub Pages is static; the original HTML files can still be opened directly.
    const PASSWORD_SHA256 = '7578ca5ba39028f7f0b0a9005de573b1187eff96afd0bfbbd2d9849e4a3973ad';
    const AUTH_KEY = 'gambooapp-qr-index-unlocked';
    const loginView = document.getElementById('login-view');
    const galleryView = document.getElementById('gallery-view');
    const loginForm = document.getElementById('login-form');
    const passwordInput = document.getElementById('password');
    const errorText = document.getElementById('login-error');
    const qrGrid = document.getElementById('qr-grid');
    let built = false;

    async function sha256(input) {
      const encoded = new TextEncoder().encode(input);
      const hash = await crypto.subtle.digest('SHA-256', encoded);
      return Array.from(new Uint8Array(hash), b => b.toString(16).padStart(2, '0')).join('');
    }

    function createQR(url) {
      const qr = new GambooQRCode.QRCode(0, GambooQRCode.ErrorCorrectLevel.M);
      qr.addData(url);
      qr.make();
      const count = qr.getModuleCount();
      const quiet = 4;
      const size = count + quiet * 2;
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
      svg.setAttribute('role','img');
      svg.setAttribute('aria-label','QRコード');
      svg.setAttribute('shape-rendering','crispEdges');
      const bg = document.createElementNS(ns, 'rect');
      bg.setAttribute('width', String(size));
      bg.setAttribute('height', String(size));
      bg.setAttribute('fill','#ffffff');
      svg.appendChild(bg);
      const dark = document.createElementNS(ns, 'path');
      dark.setAttribute('fill', '#111111');
      const fragments = [];
      for (let y = 0; y < count; y++) {
        for (let x = 0; x < count; x++) {
          if (qr.isDark(y, x)) fragments.push(`M${x + quiet} ${y + quiet}h1v1h-1z`);
        }
      }
      dark.setAttribute('d', fragments.join(''));
      svg.appendChild(dark);
      return svg;
    }

    function renderGallery() {
      if (built) return;
      const frag = document.createDocumentFragment();
      const base = new URL('./', document.baseURI);
      for (const page of PAGES) {
        const url = new URL(page.file, base).href;
        const card = document.createElement('article');
        card.className = 'card';
        const qrLink = document.createElement('a');
        qrLink.className = 'qr-link';
        qrLink.href = url;
        qrLink.target = '_blank';
        qrLink.rel = 'noopener noreferrer';
        qrLink.title = `${page.code} ${page.title}を開く`;
        qrLink.appendChild(createQR(url));
        const code = document.createElement('div');
        code.className = 'code';
        code.textContent = page.code;
        const title = document.createElement('h3');
        title.className = 'screen-name';
        title.textContent = page.title;
        card.append(qrLink, code, title);
        frag.append(card);
      }
      qrGrid.append(frag);
      built = true;
    }

    function unlock() {
      try { sessionStorage.setItem(AUTH_KEY, '1'); } catch (_) { /* Private mode */ }
      loginView.classList.add('hidden');
      galleryView.classList.remove('hidden');
      errorText.textContent = '';
      passwordInput.value = '';
      renderGallery();
    }

    loginForm.addEventListener('submit', async event => {
      event.preventDefault();
      errorText.textContent = '';
      try {
        if (await sha256(passwordInput.value) === PASSWORD_SHA256) unlock();
        else { errorText.textContent = 'パスワードが違います。'; passwordInput.select(); }
      } catch (_) {
        errorText.textContent = '認証できませんでした。HTTPSで開き直してください。';
      }
    });
    try {
      if (sessionStorage.getItem(AUTH_KEY) === '1') unlock();
      else passwordInput.focus();
    } catch (_) { passwordInput.focus(); }
  </script>
  <script src="./assets/tap-feedback.js?v=3" defer></script>
</body>
</html>
