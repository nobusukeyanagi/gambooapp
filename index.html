<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>画面QRコード一覧 | Gambooアプリ</title>
  <link rel="stylesheet" href="./assets/design-tokens.css?v=96" />
  <link rel="stylesheet" href="./assets/qr-index.css?v=10" />
  <link rel="stylesheet" href="./assets/tap-feedback.css?v=9" />
  <link rel="stylesheet" href="./assets/ui-consistency.css?v=48" />
</head>
<body>
  <section id="login-view" class="login-view" aria-label="パスワード認証">
    <div class="login-panel">
      <form id="login-form" novalidate>
        <label for="password" class="password-heading">パスワード</label>
        <input id="password" type="password" autocomplete="current-password" spellcheck="false" required autofocus>
        <div id="login-error" class="error" role="alert" aria-live="polite"></div>
        <button type="submit">認証して開く</button>
      </form>
    </div>
  </section>
  <div id="gallery-view" class="hidden">
    <main class="page-wrap">
      <div class="grid" id="qr-grid"></div>
    </main>
  </div>
  <script src="./assets/qrcode-generator.js"></script>
  <script src="./assets/qr-index.js?v=1"></script>
  <script src="./assets/tap-feedback.js?v=6" defer></script>
  <script src="./assets/text-fit.js?v=1" defer></script>
</body>
</html>
