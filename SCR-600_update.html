<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>SCR-600ダイアログ | Gambooアプリ</title>
  <link rel="stylesheet" href="./assets/design.css?v=2">
  <link rel="stylesheet" href="./assets/ui.css?v=4">
  <link rel="stylesheet" href="./assets/SCR-600_update.css?v=4">
  <script src="./assets/SCR-600_update.js?v=3" defer></script>
  <script src="./assets/ui.js?v=2" defer></script>
</head>
<body class="update-preview-page">
  <div class="update-preview">
    <main class="update-preview-stage" aria-label="アプリのバージョン更新ダイアログのプレビュー">
      <iframe class="update-preview-app" id="update-preview-app" src="./SCR-100_bet.html" title="背後に表示する車券購入画面（プレビュー）" tabindex="-1" aria-hidden="true" inert></iframe>
      <div class="update-backdrop" id="update-backdrop"></div>
      <section class="update-dialog" id="update-dialog" role="alertdialog" aria-modal="true"
        aria-labelledby="update-dialog-title" aria-describedby="update-dialog-description" tabindex="-1">
        <div class="update-dialog-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="3" width="16" height="18" rx="3"></rect>
            <path d="M12 7v7"></path>
            <path d="m9 11 3 3 3-3"></path>
            <path d="M8 17h8"></path>
          </svg>
        </div>
        <h1 class="update-dialog-title" id="update-dialog-title">新しいバージョンがあります</h1>
        <p class="update-dialog-description" id="update-dialog-description">より快適にご利用いただくため、最新バージョンへのアップデートをおすすめします。</p>
        <div class="update-dialog-actions">
          <button class="update-button update-button-primary" id="update-store" type="button">アップデートする</button>
          <button class="update-button update-button-secondary" id="update-later" type="button">あとで</button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
